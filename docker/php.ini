; Lo que cambia sobre php.ini-production. Cada valor dice por qué.

; Las exportaciones a Excel arman el archivo en memoria: con los 128M por
; defecto, una empresa grande las haría caer.
memory_limit = 512M

; El certificado de Cámara de Comercio admite hasta 10 MB
; (CreacionDeEmpresa::TAMANO_MAXIMO_EN_KB) y las plantillas de carga inicial
; pueden ser pesadas. post_max_size tiene que ser mayor que upload_max_filesize.
upload_max_filesize = 20M
post_max_size = 25M

; No anunciar la versión de PHP en las cabeceras.
expose_php = Off

; Las fechas laborales viven en Bogotá (CLAUDE.md).
date.timezone = America/Bogota

; El código no cambia dentro de un contenedor: no hace falta que OPcache revise
; los archivos en cada petición. Un despliegue es un contenedor nuevo.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
